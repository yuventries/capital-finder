  <meta name="theme-color" content="#E11D48">

  <!-- social preview (works once the page is live on GitHub Pages) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Capital Finder">
  <meta property="og:description" content="Select a country, see its capital.">
  <meta name="twitter:card" content="summary">

  <!-- relative paths throughout, so the page also works from a project sub-path -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <p class="hint">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 11v5M12 7.6v.5" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round"/>
          </svg>

        </p>

        <a class="picker__all" href="countries/">Browse all countries &rarr;</a>

      <!-- ============ RIGHT: where the capital is printed ============ -->
      <div class="output" id="output" aria-live="polite">

        <!-- empty state, replaced by the script on selection -->
        <div class="placeholder">
          <svg class="placeholder__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"
                  fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <circle cx="12" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <p class="placeholder__text">No country selected yet</p>
        </div>

  <script src="data/flags.js"></script>
  <script src="data/countries.js"></script>

</html>
